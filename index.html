<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lock-screen" class="overlay">
        <div class="lock-card">
            <h2>🔒 Access Restriced</h2>
            <p>Enter your secret PIN to access the AI Chatbot</p>
            <div class="input-group">
                <input type="password" id="pin-input" placeholder="Enter Password" autofocus />
                <button id="login-btn">Unlock</button>
            </div>
            <p id="error-message" class="error-text"></p>
        </div>
    </div>

    <div id="chat-container" class="chat-wrapper hidden">
        <header class="chat-header">
            <div class="avatar">🤖</div>
            <div class="header-info">
                <h1>Personal AI Assistant</h1>
                <span class="status-dot"></span> <small>Online</small>
            </div>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                <p>Hello! I am unlocked and ready. Ask me anything.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
